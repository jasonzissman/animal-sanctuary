<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Santuario de Animales</title>
  <style>
    html, body { margin: 0; height: 100%; background: #bfe6c8; font-family: system-ui, sans-serif; }
    #game { position: fixed; inset: 0; }
    #boot { z-index: 2; background: #bfe6c8; position: fixed; inset: 0; display: grid; place-items: center; font-size: 2rem; color: #24543a; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot">🐾 Santuario de Animales</div>
  <!-- Classic scripts only (the game runs from file://). three.js r128 is vendored: global THREE. -->
  <script src="game/vendor/three.min.js"></script>
  <!-- Game scripts, in dependency order: SA namespace first, then the data registry. -->
  <script src="game/sa.js"></script>
  <script src="game/data-registry.js"></script>
  <!-- Content data: body-part vocabulary (kind "parts"). -->
  <script src="game/data/parts.js"></script>
  <!-- Content data: biomes, then animals (cross-checked against parts and biomes). -->
  <script src="game/data/biomes.js"></script>
  <script src="game/data/animals.js"></script>
  <!-- Vocabulary manifest (kind "vocab"): every speakable key with its Spanish text and optional clip. -->
  <script src="game/data/vocab.js"></script>
  <!-- Generated voice clips (scripts/voices.js): sets entry.clip on vocab entries; others fall back to TTS. -->
  <script src="game/data/voice-clips.js"></script>
  <!-- Clue templates (kind "clueTemplates") and the pure clue engine (SA.clues). -->
  <script src="game/data/decor.js"></script>
  <script src="game/data/clues.js"></script>
  <script src="game/clues.js"></script>
  <script src="game/data/clue-levels.js"></script>
  <script src="game/clue-levels.js"></script>
  <!-- Save manager (SA.save): santuario_save_v1 with migration and in-memory fallback. -->
  <script src="game/save.js"></script>
  <script src="game/unlocks.js"></script>
  <script src="game/tree-cue.js"></script>
  <script src="game/scaffold.js"></script>
  <!-- Telemetry client (window.SAT): queues events locally, flushes only if the local receiver is running. -->
  <script src="game/telemetry.js"></script>
  <!-- Audio (SA.audio): procedural Web Audio SFX, unlocked on first gesture, persistent mute button. -->
  <script src="game/audio.js"></script>
  <script src="game/audio-ui.js"></script>
  <!-- SA.audio.say(key): clip or Spanish speechSynthesis fallback. -->
  <script src="game/speech.js"></script>
  <script>if (window.SAT) window.SAT.startSession();</script>
  <!-- World layout and camera math (pure), then rendering (the only code touching THREE), then the entry point. -->
  <script src="game/map.js"></script>
  <script src="game/peaks.js"></script>
  <script src="game/camera.js"></script>
  <script src="game/camera-frame.js"></script>
  <script src="game/station.js"></script>
  <script src="game/station-door.js"></script>
  <script src="game/npc.js"></script>
  <script src="game/player.js"></script>
  <script src="game/prick.js"></script>
  <script src="game/reach.js"></script>
  <script src="game/perch.js"></script>
  <script src="game/climb.js"></script>
  <script src="game/climb-assist.js"></script>
  <script src="game/jump.js"></script>
  <script src="game/render/reach-cue.js"></script>
  <script src="game/click-outcome.js"></script>
  <script src="game/render/click-fx.js"></script>
  <script src="game/render/world.js"></script>
  <script src="game/render/decor-dry.js"></script>
  <script src="game/render/decor.js"></script>
  <script src="game/render/station.js"></script>
  <script src="game/render/station-door-tap.js"></script>
  <!-- Animals: pure assembly plan, then the THREE builder that turns it into raycastable groups. -->
  <script src="game/animal-plan.js"></script>
  <script src="game/render/zigzag.js"></script>
  <script src="game/render/animals.js"></script>
  <script src="game/treetop-tell.js"></script>
  <script src="game/render/treetop-tell.js"></script>
  <script src="game/turn.js"></script>
  <script src="game/render/camera-rig.js"></script>
  <script src="game/render/avatar.js"></script>
  <script src="game/render/scientist.js"></script>
  <script src="game/render/hand-item.js"></script>
  <!-- Ambient life: pure seeded wandering (SA.wander), then the renderer that applies it plus idle animations. -->
  <script src="game/spacing.js"></script>
  <script src="game/wander.js"></script>
  <script src="game/gait.js"></script>
  <script src="game/render/ambient.js"></script>
  <!-- Picking: pure tap/drag logic and labels (SA.picking.onPick), then the THREE raycaster glue. -->
  <script src="game/picking.js"></script>
  <script src="game/aim.js"></script>
  <script src="game/pick-sfx.js"></script>
  <script src="game/render/picking.js"></script>
  <script src="game/render/tree-tap.js"></script>
  <!-- Scout & Spot: pure round state, whole-animal reactions, then the prompt bar + controller. -->
  <script src="game/hint-stage.js"></script>
  <script src="game/round.js"></script>
  <script src="game/photo.js"></script>
  <script src="game/album.js"></script>
  <script src="game/reroll.js"></script>
  <script src="game/render/round-fx.js"></script>
  <script src="game/render/biome-glow.js"></script>
  <script src="game/hud.js"></script>
  <script src="game/ui/hud-place.js"></script>
  <script src="game/level-cue.js"></script>
  <script src="game/ui/prompt.js"></script>
  <script src="game/unlock-flow.js"></script>
  <!-- Off-screen arrow toward the target animal: pure projection/idle logic, DOM arrow, then the wiring. -->
  <script src="game/hint-pointer.js"></script>
  <script src="game/ui/hint-arrow.js"></script>
  <script src="game/ui/hint-flow.js"></script>
  <!-- Icon-only rotate/tilt buttons for touch players: pure button->axis mapping, then the DOM pad. -->
  <script src="game/touch.js"></script>
  <script src="game/orbit-buttons.js"></script>
  <script src="game/ui/orbit-pad.js"></script>
  <!-- Icon-only walking joystick (bottom-left, shown at the first touch): pure vector mapping, then the DOM pad. -->
  <script src="game/joystick.js"></script>
  <script src="game/ui/joystick-view.js"></script>
  <script src="game/ui/climb-button.js"></script>
  <script src="game/ui/jump-button.js"></script>
  <!-- Care loop part 1 (limpiar): care-task data, pure task state, 3D mud/sparkle effects, prompt wiring. -->
  <!-- Part 2 (curar, alimentar): foods (+ their vocab entries) must load before the care task data. -->
  <script src="game/data/foods.js"></script>
  <script src="game/data/items.js"></script>
  <script src="game/data/hand-models.js"></script>
  <script src="game/inventory.js"></script>
  <script src="game/data/pickups.js"></script>
  <script src="game/pickups.js"></script>
  <script src="game/render/pickups.js"></script>
  <script src="game/space-target.js"></script>
  <script src="game/space-use.js"></script>
  <script src="game/render/target-outline.js"></script>
  <script src="game/render/auto-climb-ring.js"></script>
  <script src="game/hotbar.js"></script>
  <script src="game/data/actions.js"></script>
  <script src="game/data/care.js"></script>
  <script src="game/care.js"></script>
  <script src="game/mission.js"></script>
  <script src="game/mission-card.js"></script>
  <script src="game/data/missions.js"></script>
  <script src="game/missions.js"></script>
  <script src="game/data/intro.js"></script>
  <script src="game/intro-dialogue.js"></script>
  <script src="game/render/care-fx.js"></script>
  <script src="game/word-sequence.js"></script>
  <script src="game/ui/care-flow.js"></script>
  <script src="game/ui/mission-flow.js"></script>
  <script src="game/ui/hotbar-view.js"></script>
  <script src="game/ui/use-button.js"></script>
  <!-- Habitat sandbox: props data (+ vocab), pure placement logic, controller, DOM tray, THREE props. -->
  <script src="game/data/props.js"></script>
  <script src="game/habitat.js"></script>
  <script src="game/prop-avoid.js"></script>
  <script src="game/blocking.js"></script>
  <script src="game/ghost-refresh.js"></script>
  <script src="game/ghost-state.js"></script>
  <script src="game/sandbox.js"></script>
  <script src="game/ui/sandbox-view.js"></script>
  <script src="game/render/props.js"></script>
  <script src="game/render/prop-ghost.js"></script>
  <!-- Grown-up drawer: pure stats + settings logic, then the press-and-hold gear and drawer DOM. -->
  <script src="game/stats.js"></script>
  <script src="game/settings.js"></script>
  <script src="game/ui/album-view.js"></script>
  <script src="game/ui/station-menu-view.js"></script>
  <script src="game/missions-board.js"></script>
  <script src="game/missions-dialogue.js"></script>
  <script src="game/ui/missions-board-view.js"></script>
  <script src="game/ui/intro-view.js"></script>
  <script src="game/ui/settings-view.js"></script>
  <script src="game/menu.js"></script>
  <script src="game/ui/menu-view.js"></script>
  <script src="game/render/scene.js"></script>
  <script src="game/main.js"></script>
</body>
</html>
